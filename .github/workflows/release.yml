# Build verification only — NOT a release/deployment pipeline yet.
#
# Compiles the Electron main/preload TypeScript and builds the frontend (type-check + Vite
# bundle), then uploads both build outputs as short-retention artifacts so a run can be inspected
# without reproducing it locally. No packaging (electron-builder) and no publishing/deployment —
# both are explicitly out of scope for this stage (see ADR/0017-github-actions-ci.md and
# IMPLEMENTATION_QUEUE.md's "Future expansion" section). The name anticipates where this file
# grows once a release process is actually scoped and approved.
#
# Action versions pinned to their latest stable major release as of 2026-08-06 (verified against
# each action's own GitHub Releases page) — re-check for newer majors periodically, this isn't
# kept current automatically.

name: Release

on:
  push:
    branches: [main, "feature/**", "hotfix/**", "release/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Release build verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keep this a single, required job. A skipped job can be ambiguous to branch protection,
      # whereas skipped expensive steps still leave Release build verification successful.
      - name: Classify Release build relevance
        id: classify
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const { isReleaseBuildRelevant } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/release_build_relevance.cjs`,
            );
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changedFiles = files.map(({ filename }) => filename);
            const buildRelevant = isReleaseBuildRelevant(changedFiles);
            core.setOutput("build_relevant", String(buildRelevant));
            core.info(
              `Release build relevance: ${buildRelevant}; changed files: ${changedFiles.join(", ")}`,
            );

      - name: Release build fast path
        if: github.event_name == 'pull_request' && steps.classify.outcome == 'success' && steps.classify.outputs.build_relevant == 'false'
        run: echo "Documentation/governance-only pull request; Release dependency installation and build are not required."

      # Pinned to the project's actual current development version (confirmed via `node
      # --version` / `npm --version`), matching the engines field added to both package.json
      # files in this same stage — see ADR/0017.
      - name: Set up Node
        if: github.event_name != 'pull_request' || steps.classify.outcome != 'success' || steps.classify.outputs.build_relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Root (Electron orchestration) and frontend/ are two independent npm projects with their
      # own lockfiles — see docs/FolderStructure.md — both need their own install.
      - name: Install root dependencies
        if: github.event_name != 'pull_request' || steps.classify.outcome != 'success' || steps.classify.outputs.build_relevant == 'true'
        run: npm ci

      - name: Install frontend dependencies
        if: github.event_name != 'pull_request' || steps.classify.outcome != 'success' || steps.classify.outputs.build_relevant == 'true'
        working-directory: frontend
        run: npm ci

      # Runs `electron:build` (tsc -p electron/tsconfig.json) then the frontend's own `build`
      # (tsc -b && vite build) — see package.json's `build` script.
      - name: Build (Electron TS + frontend)
        if: github.event_name != 'pull_request' || steps.classify.outcome != 'success' || steps.classify.outputs.build_relevant == 'true'
        run: npm run build

      - name: Upload frontend build output
        if: (github.event_name != 'pull_request' || steps.classify.outcome != 'success' || steps.classify.outputs.build_relevant == 'true') && success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Upload compiled Electron output
        if: (github.event_name != 'pull_request' || steps.classify.outcome != 'success' || steps.classify.outputs.build_relevant == 'true') && success()
        uses: actions/upload-artifact@v7
        with:
          name: dist-electron
          path: dist-electron
          retention-days: 7
