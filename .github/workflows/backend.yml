# Backend validation: formatting, linting, unit tests, and an application-boot smoke test.
#
# Scope is deliberate: only backend/tests/unit runs here (no I/O, no external services). The
# Postgres-dependent backend/tests/integration suite is out of scope for this stage — see
# ADR/0017-github-actions-ci.md and IMPLEMENTATION_QUEUE.md's "Future expansion" section.
#
# Action versions pinned to their latest stable major release as of 2026-08-06 (verified against
# each action's own GitHub Releases page) — re-check for newer majors periodically, this isn't
# kept current automatically. astral-sh/setup-uv no longer publishes moving major/minor tags, so
# it's pinned to an exact release via commit hash per its own recommended usage.

name: Backend

on:
  push:
    branches: [main, "feature/**", "hotfix/**", "release/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, format, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to 3.14 — the project's actual current development version (confirmed via
      # `uv run python --version` inside backend/), not the pyproject.toml floor of >=3.12. See
      # ADR/0017's Trade-offs section for why this is a deliberate, narrower signal than testing
      # against the documented minimum-supported version.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # --locked fails the build if uv.lock is out of sync with pyproject.toml, instead of
      # silently re-resolving — a cheap reproducibility guard, not just an install step.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check src tests alembic

      - name: Format check (black)
        run: uv run black --check src tests alembic

      - name: Unit tests
        run: uv run pytest tests/unit -v --junitxml=test-results/unit-results.xml

      # Exercises create_app() -> configure_container() -> assert_container_healthy() with zero
      # external dependencies (every default port implementation is in-memory/logging-only) — the
      # cheapest meaningful "does the app actually boot" signal available without a database.
      - name: Application import / boot smoke test
        run: uv run python -c "from app.main import app; print('Booted OK:', app.title, app.version)"

      - name: Upload unit test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-test-results
          path: backend/test-results/unit-results.xml
          retention-days: 7
