# Frontend validation: formatting, linting, and unit tests (Vitest + React Testing Library).
#
# Action versions pinned to their latest stable major release as of 2026-08-06 (verified against
# each action's own GitHub Releases page) — re-check for newer majors periodically, this isn't
# kept current automatically.

name: Frontend

on:
  push:
    branches: [main, "feature/**", "hotfix/**", "release/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to the project's actual current development version (confirmed via `node
      # --version` / `npm --version`), matching the engines field added to package.json in this
      # same stage — see ADR/0017.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=./test-results/unit-results.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-test-results
          path: frontend/test-results/unit-results.xml
          retention-days: 7
