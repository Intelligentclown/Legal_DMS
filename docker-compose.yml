services:
  postgres:
    image: postgres:16-alpine
    container_name: legal_dms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal_dms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_dms}
      POSTGRES_DB: ${POSTGRES_DB:-legal_dms_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_dms}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
