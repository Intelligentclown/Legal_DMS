[project]
name = "legal-dms-backend"
version = "0.2.0"
description = "Legal Document & Matter Management System — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[project.scripts]
bootstrap-admin = "app.infrastructure.cli.bootstrap:main"
provision-app-role = "app.infrastructure.cli.provision_app_role:main"
reconcile-organizations = "app.infrastructure.cli.reconcile_organizations:main"
client-migration-preflight = "app.infrastructure.cli.client_migration_preflight:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.black]
line-length = 100
target-version = ["py312"]
